# GoAccess configuration for nharc.org traffic reports.
# Installed on the server at /etc/goaccess/nharc.conf; run nightly by
# nharc-stats.service. See deploy/stats/README.md.

# Caddy writes its access log as one JSON object per line. GoAccess ships a
# predefined parser for exactly that shape; `ts` is a float Unix timestamp,
# hence the %s date/time formats.
log-format CADDY
date-format %s
time-format %s

# Static HTML report, served (behind basic auth) at https://nharc.org/stats.
output /var/www/nharc-stats/index.html
html-report-title nharc.org — traffic

# Real names in the report rather than raw tokens.
real-os true
double-decode true

# Treat these as assets so the "Requested Files" panel shows pages, not a wall
# of hashed CSS/JS. Astro emits fingerprinted files under /_astro/.
static-file .css
static-file .js
static-file .svg
static-file .png
static-file .jpg
static-file .jpeg
static-file .webp
static-file .ico
static-file .woff
static-file .woff2

# Crawlers get their own panel rather than being silently dropped — for a club
# site, "is Google actually indexing us" is a question worth being able to ask.
# Flip this to true if bot noise ever drowns out the human numbers.
ignore-crawlers false
unknowns-as-crawlers true

# Collapse the per-request query strings on the CMS/OAuth endpoints.
ignore-panel KEYPHRASES
