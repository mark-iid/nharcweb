# Sveltia CMS configuration for the NHARC website.
# Docs: https://github.com/sveltia/sveltia-cms
#
# Before this editor can save changes, complete the one-time backend setup in
# HANDOFF.md:  (1) push this repo to GitHub, (2) set `repo` below to the real
# org/name, (3) wire up a GitHub OAuth app so editors can log in.

backend:
  name: github
  repo: mark-iid/nharcweb
  branch: main
  # Self-hosted OAuth relay (nharc-oauth.service, proxied by Caddy at /auth + /callback).
  base_url: https://nharc.org
  auth_endpoint: auth

# Where files uploaded through the CMS (images, PDFs, slide decks) are stored / referenced.
media_folder: public/uploads
public_folder: /uploads

# Automatically optimize images uploaded through the CMS: resize oversized
# photos down and re-encode them to WebP so pages stay light on the small server.
# Editors can upload straight off a phone/camera without resizing first.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
        svg:
          optimize: true
      slugify_filename: true

# Show a live preview link in the editor.
site_url: https://nharc.org
display_url: https://nharc.org

collections:
  # ---------- Site-wide settings ----------
  - name: settings
    label: Site Settings
    files:
      - name: site
        label: Club Info & Schedule
        file: src/data/site.json
        format: json
        fields:
          - { name: clubName, label: Club name, widget: string }
          - { name: shortName, label: Short name, widget: string }
          - { name: callsign, label: Callsign, widget: string }
          - { name: tagline, label: Tagline, widget: text }
          - { name: email, label: General email, widget: string }
          - { name: bankEmail, label: Zelle / dues email, widget: string }
          - { name: veEmail, label: VE testing email, widget: string }
          - name: mailingAddress
            label: Mailing address
            widget: object
            fields:
              - { name: line1, label: PO Box / street, widget: string }
              - { name: city, label: City, widget: string }
              - { name: state, label: State, widget: string }
              - { name: zip, label: ZIP, widget: string }
          - { name: facebook, label: Facebook URL, widget: string }
          - name: meetingVenue
            label: Meeting venue
            widget: object
            fields:
              - { name: name, label: Venue name, widget: string }
              - { name: address, label: Address, widget: string }
              - { name: parking, label: Parking note, widget: text }
          - name: meetings
            label: Meeting schedule
            widget: object
            fields:
              - { name: business, label: Business meeting, widget: text }
              - { name: activities, label: Activities meeting, widget: text }
          - { name: membershipDues, label: Membership dues, widget: string }
          - { name: breakfast, label: Breakfast note, widget: text }

  # ---------- Home page ----------
  - name: homepage
    label: Home Page
    files:
      - name: home
        label: Front page content
        file: src/data/home.json
        format: json
        fields:
          - { name: heroLede, label: Intro paragraph (top of the page), widget: text }
          - { name: aroundBlurb, label: "\"Around the club\" blurb", widget: text }
          - name: raffle
            label: Raffle callout
            widget: object
            fields:
              - { name: enabled, label: Show the raffle callout on the home page, widget: boolean, default: true }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: buttonLabel, label: Button label, widget: string }
              - { name: buttonHref, label: Button link, widget: string }

  # ---------- Repeaters ----------
  - name: repeaters
    label: Repeaters
    files:
      - name: repeaters
        label: Repeater list
        file: src/data/repeaters.json
        format: json
        fields:
          - name: repeaters
            label: Repeaters
            widget: list
            fields:
              - { name: frequency, label: Frequency (MHz), widget: string }
              - { name: callsign, label: Callsign, widget: string }
              - { name: band, label: Band, widget: string, required: false }
              - { name: mode, label: Mode, widget: string, required: false }
              - { name: tone, label: Tone, widget: string, required: false }
              - { name: power, label: Power, widget: string, required: false }
              - { name: location, label: Location, widget: string, required: false }
              - { name: notes, label: Notes, widget: text, required: false }

  # ---------- Nets ----------
  - name: nets
    label: Nets
    files:
      - name: nets
        label: Net schedule
        file: src/data/nets.json
        format: json
        fields:
          - name: nets
            label: Nets
            widget: list
            fields:
              - { name: name, label: Net name, widget: string }
              - { name: day, label: Day, widget: string }
              - { name: time, label: Time, widget: string }
              - { name: repeater, label: Repeater / where, widget: string }
              - { name: extra, label: Extra info, widget: string, required: false }
              - { name: notes, label: Notes, widget: text, required: false }

  # ---------- Officers ----------
  - name: officers
    label: Officers
    files:
      - name: officers
        label: Officer roster
        file: src/data/officers.json
        format: json
        fields:
          - name: officers
            label: Officers
            widget: list
            fields:
              - { name: role, label: Position, widget: string }
              - { name: name, label: Name, widget: string }
              - { name: callsign, label: Callsign, widget: string }

  # ---------- Editable pages (prose) ----------
  - name: pages
    label: Pages
    folder: src/content/pages
    format: frontmatter
    extension: md
    create: false
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: SEO description, widget: text, required: false }
      - name: body
        label: Body
        widget: markdown
        hint: 'Add a picture with the image button in the toolbar — large photos are resized automatically on upload. To reuse an image already uploaded, type `![description](/uploads/filename)`.'

  # ---------- News / announcements ----------
  - name: news
    label: News
    folder: src/content/news
    format: frontmatter
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: summary, label: Summary, widget: text, required: false }
      - { name: pinned, label: Pin to top, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - name: body
        label: Body
        widget: markdown
        hint: 'Add a picture with the image button in the toolbar — large photos are resized automatically on upload. To reuse an image already uploaded, type `![description](/uploads/filename)`.'

  # ---------- Events / calendar ----------
  - name: events
    label: Events / Calendar
    folder: src/content/events
    format: frontmatter
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: Event title, widget: string }
      - { name: date, label: Date & time, widget: datetime }
      - { name: endDate, label: End (optional — for multi-day events), widget: datetime, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - { name: featured, label: Feature on the home page, widget: boolean, default: false }
      - { name: draft, label: Hide (draft), widget: boolean, default: false }
      - { name: body, label: Details, widget: markdown, required: false }

  # ---------- Meeting minutes ----------
  - name: minutes
    label: Meeting Minutes
    folder: src/content/minutes
    format: frontmatter
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.meeting}}"
    identifier_field: date
    fields:
      - { name: date, label: Meeting date, widget: datetime, time_format: false }
      - name: meeting
        label: Meeting type
        widget: select
        options: ["Business", "Activities"]
        default: Business
      - { name: title, label: Title (optional), widget: string, required: false }
      - { name: document, label: Attach minutes PDF (optional), widget: file, required: false }
      - { name: draft, label: Hide from site (draft), widget: boolean, default: false }
      - name: body
        label: Minutes text (optional if a PDF is attached)
        widget: markdown
        required: false
        hint: 'Add a picture with the image button in the toolbar — large photos are resized automatically on upload. To reuse an image already uploaded, type `![description](/uploads/filename)`.'

  # ---------- Activities presentations ----------
  - name: presentations
    label: Presentations
    folder: src/content/presentations
    format: frontmatter
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false }
      - { name: presenter, label: Presenter, widget: string, required: false }
      - { name: file, label: Slide deck (PDF), widget: file, required: false }
      - { name: summary, label: Short description, widget: text, required: false }
      - { name: draft, label: Hide from site (draft), widget: boolean, default: false }
      - name: body
        label: Notes (optional)
        widget: markdown
        required: false
        hint: 'Add a picture with the image button in the toolbar — large photos are resized automatically on upload. To reuse an image already uploaded, type `![description](/uploads/filename)`.'
